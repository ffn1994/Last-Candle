<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Last Candle</title>
  <meta name="application-name" content="Last Candle">
  <meta name="apple-mobile-web-app-title" content="Last Candle">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0a10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div class="meter"><div id="wax-bar"></div></div>
    <div id="time">0.0</div>
  </div>

  <section id="menu" class="overlay">
    <h1>الشمعة الأخيرة</h1>
    <p class="lead">كل الشموع انطفت… إلا شمعتك.</p>
    <p class="how">حرّك الشمعة بالسحب أو بالأسهم. اجمع قطرات الشمع لتبقى مشتعلة، وابتعد عن تيارات الريح.</p>
    <button id="start">ابدأ</button>
    <p class="best">أفضل وقت: <span id="best">0.0</span> ث</p>
  </section>

  <section id="over" class="overlay" hidden>
    <h2>انطفأت الشمعة</h2>
    <p>صمدت <span id="final">0.0</span> ثانية</p>
    <p class="best" id="new-best" hidden>رقم قياسي جديد!</p>
    <button id="restart">أشعلها من جديد</button>
  </section>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
